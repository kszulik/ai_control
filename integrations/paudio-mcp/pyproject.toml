[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paudio-mcp"
version = "0.1.0"
description = "Read-only local repository bridge for ChatGPT/MCP workflows"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
