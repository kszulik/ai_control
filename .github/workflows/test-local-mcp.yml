name: Test local MCP prototype

on:
  push:
    branches:
      - feature/local-mcp-v0.1
    paths:
      - "integrations/paudio-mcp/**"
      - "core/ACCESS_BACKENDS.md"
      - "AI_PROJECT_PROMPT.md"
      - "PROJECT_REGISTRY.md"
      - "projects/2lg2_avc.md"
      - ".github/workflows/test-local-mcp.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/paudio-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src

      - name: Unit tests
        run: pytest -q

      - name: MCP import smoke test
        env:
          PAUDIO_MCP_CONFIG: config.example.toml
        run: python -c "import paudio_mcp.server; print('MCP import OK')"
